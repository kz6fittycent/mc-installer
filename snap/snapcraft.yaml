name: mc-installer
title: Minecraft Installer
adopt-info: launcher
summary: A simple installer for Minecraft - Java Edition
description: |
  A simple installer for Minecraft - Java Edition.

  It downloads the official Minecraft launcher and keeps it up to date. Sign
  in with your Microsoft account to play. Minecraft itself isn't included.

  Want mods? Open "MC Mods" (or right-click the Minecraft icon and
  choose "Set Up Mods") to install Fabric for the Minecraft version you play,
  then search Modrinth for mods and resource packs and install them with one
  click. Modrinth modpacks (.mrpack) can be imported too.

  New to it? The wiki takes you from installing to playing, with mods and
  servers: https://github.com/kz6fittycent/mc-installer/wiki

  Not an official Minecraft product. Not approved by or associated with
  Mojang or Microsoft.
license: MIT
website: https://minecraft.net
contact: https://github.com/kz6fittycent/mc-installer/issues
issues: https://github.com/kz6fittycent/mc-installer/issues
source-code: https://github.com/kz6fittycent/mc-installer
icon: snap/gui/mcinstaller.png
donation: https://www.patreon.com/kz6fittycent
  
base: core24
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
    
plugs:
  dot-minecraft:
    interface: personal-files
    write:
      - $HOME/.minecraft
apps:
  mc-installer:
    extensions:
      - gnome
    command: launch
    plugs:
      - network
      - opengl
      - audio-playback
      - audio-record
      - browser-support
      - home
      - dot-minecraft   
      - removable-media
      - desktop
      - desktop-legacy
      - x11
      - wayland
    environment:
      JAVA_HOME: $SNAP/usr/lib/jvm/java-25-openjdk-amd64/
      # Don't force __NV_PRIME_RENDER_OFFLOAD / __GLX_VENDOR_LIBRARY_NAME here:
      # on a desktop where the NVIDIA card drives the display, PRIME offload
      # leaves the game window unpainted (you see the desktop through it).
      # Hybrid laptops get the dGPU via PrefersNonDefaultGPU in the .desktop file.
      __GL_THREADED_OPTIMIZATIONS: 0
  # Separate window for Fabric, mods, resource packs and modpacks
  # (scripts/mods.py). Desktop file:
  # snap/gui/mods.desktop. It edits the same $SNAP_USER_DATA/.minecraft.
  mods:
    extensions:
      - gnome
    command: mods.py
    plugs:
      - network
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland
parts:
  launcher:
    plugin: dump
    source: scripts
    
    override-pull: |
      craftctl default
      # --match 'v*': the snap-rev-<revision> tags the CI workflows push
      # must not become the version. -C: parts/ isn't inside the repo
      # when building in LXD (snapcore/action-build).
      craftctl set version="$(git -C "$CRAFT_PROJECT_DIR" describe --tags --match 'v*' | sed 's/^v//' | cut -d "-" -f1)"
       
  game:
    plugin: nil
    build-packages:
      - openjdk-25-jre-headless        
      - ca-certificates-java
      - ca-certificates      
    stage-packages:
      - libglu1-mesa
      - libswt-gtk-4-java
      - python3-requests
      - openjdk-25-jre-headless
      - libxss1
     # - libgconf-2-4
      - libcurl4
      - x11-xserver-utils
      - libflite1
      - python3-gi
    override-prime: |
      craftctl default
      # The narrator (com.mojang.text2speech) asks for libflite.so and
      # libflite_cmu_us_kal16.so by those plain names, but libflite1 only
      # has the numbered ones (.so.1). The -dev package would add the plain
      # names plus static libraries and headers we don't need.
      cd "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu"
      ln -sf libflite.so.1 libflite.so
      ln -sf libflite_cmu_us_kal16.so.1 libflite_cmu_us_kal16.so
     
  cleanup:
    after: 
      - game
      - launcher
    plugin: nil
    build-snaps: [core24, gtk-common-themes, gnome-46-2404]
    override-prime: |
      set -eux
      for snap in "core24" "gtk-common-themes" "gnome-46-2404"; do
        cd "/snap/$snap/current" && find . -type f,l -name *.so.* -exec rm -f "$CRAFT_PRIME/{}" \;
      done
